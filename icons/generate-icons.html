<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Icon Generator for Innovia App</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        .icon-preview {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 20px;
            margin: 20px 0;
        }
        .icon-item {
            text-align: center;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }
        canvas {
            border: 1px solid #ccc;
            border-radius: 8px;
        }
        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover {
            background: #1e40af;
        }
        .instructions {
            background: #f0f9ff;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #2563eb;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <h1>Innovia App Icon Generator</h1>
    
    <div class="instructions">
        <h3>Instructions:</h3>
        <ol>
            <li>Click "Generate All Icons" button below</li>
            <li>Right-click on each icon and select "Save image as..."</li>
            <li>Save each icon with its corresponding filename (e.g., icon-192x192.png)</li>
            <li>Place all icons in the /icons/ folder of your project</li>
        </ol>
    </div>

    <button onclick="generateAllIcons()">Generate All Icons</button>
    <button onclick="downloadAllIcons()">Download All Icons (ZIP)</button>

    <div id="iconContainer" class="icon-preview"></div>

    <script>
        const sizes = [72, 96, 128, 144, 152, 192, 384, 512];
        
        function createIcon(size) {
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');
            
            // Create gradient background
            const gradient = ctx.createLinearGradient(0, 0, size, size);
            gradient.addColorStop(0, '#2563eb');
            gradient.addColorStop(1, '#1e40af');
            
            // Background with rounded corners
            const cornerRadius = size * 0.15;
            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.roundRect(0, 0, size, size, cornerRadius);
            ctx.fill();
            
            // Draw building
            const buildingWidth = size * 0.4;
            const buildingHeight = size * 0.5;
            const buildingX = (size - buildingWidth) / 2;
            const buildingY = size * 0.25;
            
            ctx.fillStyle = 'rgba(255, 255, 255, 0.95)';
            ctx.beginPath();
            ctx.roundRect(buildingX, buildingY, buildingWidth, buildingHeight, size * 0.02);
            ctx.fill();
            
            // Draw windows
            const windowSize = buildingWidth * 0.2;
            const windowGap = buildingWidth * 0.1;
            ctx.fillStyle = '#2563eb';
            
            for (let row = 0; row < 3; row++) {
                for (let col = 0; col < 3; col++) {
                    const wx = buildingX + windowGap + col * (windowSize + windowGap);
                    const wy = buildingY + windowGap + row * (buildingHeight * 0.25);
                    ctx.beginPath();
                    ctx.roundRect(wx, wy, windowSize, windowSize, size * 0.01);
                    ctx.fill();
                }
            }
            
            // Draw door
            const doorWidth = buildingWidth * 0.3;
            const doorHeight = buildingHeight * 0.22;
            const doorX = buildingX + (buildingWidth - doorWidth) / 2;
            const doorY = buildingY + buildingHeight - doorHeight;
            
            ctx.fillStyle = '#1e40af';
            ctx.beginPath();
            ctx.roundRect(doorX, doorY, doorWidth, doorHeight, size * 0.01);
            ctx.fill();
            
            // Draw "I" letter
            ctx.fillStyle = 'white';
            ctx.font = `bold ${size * 0.35}px Arial, sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('I', size / 2, size * 0.86);
            
            return canvas;
        }
        
        function generateAllIcons() {
            const container = document.getElementById('iconContainer');
            container.innerHTML = '';
            
            sizes.forEach(size => {
                const canvas = createIcon(size);
                
                const div = document.createElement('div');
                div.className = 'icon-item';
                
                const title = document.createElement('div');
                title.innerHTML = `<strong>${size}x${size}</strong>`;
                
                const filename = document.createElement('div');
                filename.style.fontSize = '12px';
                filename.style.color = '#666';
                filename.textContent = `icon-${size}x${size}.png`;
                
                const downloadBtn = document.createElement('button');
                downloadBtn.textContent = 'Download';
                downloadBtn.onclick = () => downloadIcon(canvas, `icon-${size}x${size}.png`);
                
                div.appendChild(title);
                div.appendChild(canvas);
                div.appendChild(filename);
                div.appendChild(downloadBtn);
                
                container.appendChild(div);
            });
        }
        
        function downloadIcon(canvas, filename) {
            canvas.toBlob(blob => {
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            });
        }
        
        async function downloadAllIcons() {
            // Note: This requires JSZip library for actual ZIP creation
            // For now, download individually
            alert('Please click "Download" button on each icon individually, or use the JSZip library for batch download.');
            
            // Alternative: trigger all downloads with delay
            const container = document.getElementById('iconContainer');
            const buttons = container.querySelectorAll('button');
            buttons.forEach((btn, index) => {
                setTimeout(() => btn.click(), index * 500);
            });
        }
        
        // Polyfill for roundRect if not available
        if (!CanvasRenderingContext2D.prototype.roundRect) {
            CanvasRenderingContext2D.prototype.roundRect = function(x, y, width, height, radius) {
                if (width < 2 * radius) radius = width / 2;
                if (height < 2 * radius) radius = height / 2;
                this.moveTo(x + radius, y);
                this.arcTo(x + width, y, x + width, y + height, radius);
                this.arcTo(x + width, y + height, x, y + height, radius);
                this.arcTo(x, y + height, x, y, radius);
                this.arcTo(x, y, x + width, y, radius);
                return this;
            };
        }
        
        // Generate icons on page load
        window.addEventListener('load', generateAllIcons);
    </script>
</body>
</html>
