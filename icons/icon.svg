<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="80" fill="url(#grad1)"/>
  
  <!-- Building icon -->
  <g transform="translate(156, 128)">
    <!-- Main building -->
    <rect x="0" y="0" width="200" height="256" fill="white" opacity="0.95" rx="10"/>
    
    <!-- Windows -->
    <rect x="20" y="30" width="40" height="40" fill="#2563eb" rx="5"/>
    <rect x="80" y="30" width="40" height="40" fill="#2563eb" rx="5"/>
    <rect x="140" y="30" width="40" height="40" fill="#2563eb" rx="5"/>
    
    <rect x="20" y="90" width="40" height="40" fill="#2563eb" rx="5"/>
    <rect x="80" y="90" width="40" height="40" fill="#2563eb" rx="5"/>
    <rect x="140" y="90" width="40" height="40" fill="#2563eb" rx="5"/>
    
    <rect x="20" y="150" width="40" height="40" fill="#2563eb" rx="5"/>
    <rect x="80" y="150" width="40" height="40" fill="#2563eb" rx="5"/>
    <rect x="140" y="150" width="40" height="40" fill="#2563eb" rx="5"/>
    
    <!-- Door -->
    <rect x="70" y="200" width="60" height="56" fill="#1e40af" rx="5"/>
  </g>
  
  <!-- Letter "I" for Innovia -->
  <text x="256" y="440" font-family="Arial, sans-serif" font-size="180" font-weight="bold" fill="white" text-anchor="middle">I</text>
</svg>
